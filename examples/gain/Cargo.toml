[package]
name = "seam-example-gain"
description = "A gain with three modes, a label and MIDI learn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["audio", "plugin", "gain", "vst3", "example"]
categories = ["multimedia::audio"]
publish.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Who the plugin is, to every host: `seam_host::manifest_info!` reads it,
# with the version and description above.
[package.metadata.seam]
name = "Seam Example Gain"
vendor = "Seam"
id = "dev.seam.example-gain"
vst3-class-id = "5b0ad271-3e96-4c18-a37f-e0248db56a19"
au-codes = { subtype = "SmGn", manufacturer = "Seam" }
category = "effect"

[lib]
# The cdylib is the VST3 module; the rlib lets tests drive it in-process.
crate-type = ["cdylib", "rlib"]

[features]
default = ["vst3"]
# The VST3 module's entry points, through Seam's exporter.
vst3 = ["seam-host/vst3"]

[dependencies]
seam-host = { workspace = true, features = ["manifest"] }
seam-learn.workspace = true
seam-params = { workspace = true, features = ["derive"] }
seam-undo.workspace = true

[dev-dependencies]
seam-host = { workspace = true, features = ["vst3", "test-host"] }
seam-ump.workspace = true
seam-testkit.workspace = true

[lints]
workspace = true
