[package]
name = "hapto-example-eq"
description = "Six biquad bands and an output gain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["audio", "plugin", "equalizer", "vst3", "example"]
categories = ["multimedia::audio"]
publish.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Who the plugin is, to every host: `hapto_host::manifest_info!` reads it,
# with the version and description above.
[package.metadata.hapto]
name = "Hapto Example EQ"
vendor = "Hapto"
id = "dev.hapto.example-eq"
vst3-class-id = "44f0fc1b-fd79-434d-a987-84b801dc348b"
au-codes = { subtype = "SmEq", manufacturer = "Hapt" }
category = "effect"
features = ["equalizer"]

[lib]
# The cdylib is the VST3 module; the rlib lets tests drive it in-process. The
# JUCE adapter builds the static library itself, with only `cabi` on.
crate-type = ["cdylib", "rlib"]

[features]
default = ["vst3"]
# The VST3 module's entry points, through Hapto's exporter.
vst3 = ["hapto-host/vst3"]
# The C interface's one symbol, for the JUCE adapter, which defines the VST3
# entry points itself: built without `vst3`.
cabi = ["hapto-host/cabi"]

[dependencies]
hapto-host = { workspace = true, features = ["manifest"] }
hapto-params.workspace = true

[dev-dependencies]
hapto-host = { workspace = true, features = ["vst3", "cabi", "test-host"] }
hapto-testkit.workspace = true
serde_json.workspace = true
iai-callgrind.workspace = true

[lints]
workspace = true

[[bench]]
name = "iai"
harness = false
