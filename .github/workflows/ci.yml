name: CI

# Two sizes of run.
#
# A pull request takes the thin gate: what a developer's own machine cannot
# show (Linux, and macOS in a light form) and the checks that cost seconds.
# It runs once the pull request is ready for review, never on a draft, and
# main is not tested again after a merge, since the squash of a branch rebased
# onto main is the tree its pull request tested.
#
# A run started by hand, from any branch, is the full run: every job, every
# step on Windows and macOS, and the larger property-test count. It is for a
# change the thin gate cannot judge, and for the commit a release is cut from.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      bench_base:
        description: A revision the benchmarks are compared against (a pull request uses its base)
        default: ""

permissions:
  contents: read

# Supersede runs on a branch, but let a run on main finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # A pull request takes macOS alone, and only the steps that show its
        # code lints and passes: Clippy with all features, Clippy of the MIDI
        # devices for Windows, and the tests in debug. That leg is the gate's
        # one build of the VST3 exporter; a developer's Windows machine shows
        # the rest. The full run takes both systems and every step.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-2025", "macos-15"]' || '["macos-15"]') }}
    runs-on: ${{ matrix.os }}
    env:
      EVERY_STEP: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the compiler. `rustup show` no longer
      # installs it, so install it explicitly (no argument: the pinned one).
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        if: env.EVERY_STEP == 'true'
        run: cargo fmt --all --check
      # Every step that resolves dependencies runs --locked, so a lockfile out
      # of step with the manifests fails.
      - name: Clippy (default features)
        if: env.EVERY_STEP == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The MIDI devices' WinMM backend builds for Windows alone, so the
      # macOS leg checks it for Windows too, with no linking: the crate's
      # dependencies are Rust alone, which builds for any target from here.
      - name: Clippy (the MIDI devices for Windows)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo clippy -p hapto-midi-devices --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings
      # Release builds drop debug assertions, so the code and the lints that
      # see it differ from the debug build's.
      - name: Clippy (release)
        if: env.EVERY_STEP == 'true'
        run: cargo clippy --workspace --all-targets --all-features --release --locked -- -D warnings
      # Includes the drift gates for generated files (xtask's drift test,
      # hapto-bridge's typescript_drift) and the allocation gates in debug.
      - name: Test
        run: cargo test --workspace --all-features --locked
        # Property tests: proptest's default 256 cases on pull requests,
        # sixteen times as many on a run started by hand.
        env:
          PROPTEST_CASES: ${{ github.event_name == 'workflow_dispatch' && '4096' || '256' }}
      # Everything again on optimised code, doc tests included: a test that
      # branches on debug assertions takes its other side here.
      - name: Test (release)
        if: env.EVERY_STEP == 'true'
        run: cargo test --workspace --all-features --release --locked
        env:
          PROPTEST_CASES: ${{ github.event_name == 'workflow_dispatch' && '4096' || '256' }}
      # A failing property test writes the case it found next to its test;
      # keep it, so the failure can be replayed and committed.
      - name: Keep the property tests' failing cases
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proptest-regressions-${{ matrix.os }}
          path: "**/*.proptest-regressions"
          if-no-files-found: ignore
      # The allocation gates again on optimised code, which is what a host
      # runs. A crate that adds tests/alloc_gate.rs joins this step with no
      # edit here.
      - name: Allocation gates (release)
        if: env.EVERY_STEP == 'true'
        run: cargo test --workspace --all-features --release --test alloc_gate --locked
      # The example EQ through both exporters across block sizes, rates and
      # layouts, under the allocation gate, on optimised code.
      - name: Gate matrix (release)
        if: env.EVERY_STEP == 'true'
        run: cargo test -p hapto-example-eq --release --test matrix --test overflow --locked
      - name: Docs
        if: env.EVERY_STEP == 'true'
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Full run only.
  # Nightly rustdoc counts the public types, traits, functions and macros that
  # should carry an example and the ones that do. The count is unstable, so
  # this lane pins the nightly the scheduled lanes use; the stable toolchain
  # runs the examples themselves in the Test step above. Windows, because that
  # leg builds the VST3 exporter.
  examples:
    name: doc examples
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    runs-on: windows-2025
    env:
      NIGHTLY: nightly-2026-11-04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup toolchain install $env:NIGHTLY --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Every public type, trait, function and macro has an example
        run: python scripts/check-example-coverage.py

  core-alone:
    name: core builds alone
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Fails if a core crate or the bridge would link a window, WebView, UI
      # toolkit or plugin-format crate on any platform, with any features.
      - name: No window, WebView or host dependency
        run: python3 scripts/check-core-deps.py
      # The two checks below read Rust through `cargo xtask scan` and `defs`
      # (proc-macro2 and syn). Built without the generators, so the lane needs
      # no crate of the workspace. The reader's own tests run first.
      - name: The Rust reader's tests
        run: cargo test -p xtask --no-default-features --locked
      - name: Build the Rust reader
        run: cargo build -p xtask --no-default-features --locked
      # Prose in the comments of crates/, examples/ and xtask/ wraps at 80
      # columns, as rustfmt wraps their code.
      - name: Comments wrap at 80 columns
        run: target/debug/xtask wrap --max 80
      # So does the prose of README.md, ARCHITECTURE.md, CHANGELOG.md, the
      # bench and page READMEs and docs/; tables, code and unbreakable links
      # are exempt.
      - name: Docs wrap at 80 columns
        run: target/debug/xtask wrap --markdown --max 80
      # Comments and docs give their reason in words, never a decision id;
      # the script's docstring states what it scans.
      - name: No decision ids in comments or docs
        run: python3 scripts/check-comment-tags.py
        env:
          HAPTO_XTASK: target/debug/xtask
      # The decision index still names files and items that exist, and every
      # id the decision record has.
      - name: The decision index matches the record and the code
        run: python3 scripts/check-decision-index.py
        env:
          HAPTO_XTASK: target/debug/xtask
      # The check scripts refuse the bad input they exist for.
      - name: The check scripts' own tests
        run: python3 scripts/test-checks.py
        env:
          HAPTO_XTASK: target/debug/xtask
      # The fuzz crate is outside the workspace, with a lockfile of its own,
      # which a new dependency of a crate it fuzzes changes. The nightly fuzz
      # lane reads it --locked, so a stale one is caught here, where the
      # change that made it stale is.
      - name: The fuzz crate's lockfile is current
        run: |
          if ! cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null; then
            echo "::error::fuzz/Cargo.lock is stale: run cargo metadata --format-version 1 --manifest-path fuzz/Cargo.toml once, and commit the lockfile it writes."
            exit 1
          fi
      # And they build on a runner with no WebView or GTK development
      # libraries installed. Every workspace crate is built but the ones that
      # may need them (the host, the WebView shell, the standalone app, the
      # example plugins), the test tools and xtask, so a new crate is
      # built here until it is excluded.
      - name: Build the core alone
        run: cargo build --workspace --exclude hapto-host --exclude hapto-webview --exclude hapto-standalone --exclude hapto-example-eq --exclude hapto-example-gain --exclude hapto-example-midi-probe --exclude hapto-testkit --exclude xtask --locked

  loom:
    name: loom models
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The model checks of the lock-free hand-offs in params, learn, host
      # and midi-devices; docs/testing.md lists what each checks. --cfg loom swaps their
      # atomics for loom's, which work only inside a model, so only the
      # models run. The script counts the models in the source and fails
      # unless each one ran.
      - name: loom
        run: python3 scripts/run-loom.py

  # The protocol's shape file only gains lines; the Rust test reads just its
  # last line, so this compares the whole file with the pull request's base.
  protocol-shape:
    name: protocol shape history
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The shape file only gains lines
        run: python3 scripts/check-shape-append-only.py "${BASE}"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

  page:
    name: page
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: page
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            page/package-lock.json
            examples/gain/page/package-lock.json
      - run: npm ci
      # Type-checks the page against the committed generated contract; the
      # rust job checks that contract against the Rust types.
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # The example gain's page, on the package above and the gain's generated
      # parameter map, so the example cannot rot. Its build is what the gain
      # embeds; a plugin built without it has no editor.
      - name: The gain's page installs
        working-directory: examples/gain/page
        run: npm ci
      - name: The gain's page type-checks
        working-directory: examples/gain/page
        run: npm run typecheck
      - name: The gain's page builds
        working-directory: examples/gain/page
        run: npm run build
      # The gain builds these in by name (`examples/gain/build.rs`): a name
      # Vite changes would leave the plugin with no editor and no failure.
      - name: The gain's page writes the files the gain builds in
        working-directory: examples/gain/page
        run: |
          test -f dist/index.html
          test -f dist/assets/index.js
          test -f dist/assets/index.css

  # Everything Hapto supports on Linux: the core, the bridge, the C interface
  # and the example EQ through it. The VST3 exporter refuses to build here by
  # design (it has no main-thread timer), and a check proves the refusal.
  linux:
    name: linux
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      PACKAGES: --workspace
      FEATURES: --no-default-features --features hapto-host/cabi,hapto-host/test-host,hapto-example-eq/cabi,hapto-bridge/typescript,xtask/generate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Here as well as in `rust`, whose Format step a pull request skips.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy $PACKAGES $FEATURES --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test $PACKAGES $FEATURES --locked
        env:
          PROPTEST_CASES: ${{ github.event_name == 'workflow_dispatch' && '4096' || '256' }}
      - name: Allocation gates (release)
        run: cargo test $PACKAGES $FEATURES --release --test alloc_gate --locked
      - name: Gate matrix (release)
        run: cargo test -p hapto-example-eq --no-default-features --features cabi --release --test matrix --test overflow --locked
      # This step tests the run loop timer, which a Linux VST3 host will drive,
      # against the test host's run loop. The exporter's other tests need a
      # thread timer or a window, and Linux has neither yet.
      - name: The run loop timer
        run: |
          cargo test -p hapto-host --no-default-features --features vst3 --lib --locked -- engine::timer:: vst3::tests::run_loop::
      - name: The VST3 module refuses to build
        run: |
          if cargo check -p hapto-example-eq --locked 2> refusal.txt; then
            echo "the VST3 module built on Linux"
            exit 1
          fi
          cat refusal.txt
          grep -q "the VST3 exporter builds for Windows and macOS only" refusal.txt

  # hapto.h compiles as C11 and C++11 for both architectures, so its size and
  # offset assertions run: they fail when the header's layout disagrees with
  # the compiler's. -ffreestanding takes clang's own stdint.h, so no
  # cross-compilation sysroot is needed to check a target's layout.
  header:
    name: hapto.h
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile
        run: |
          clang --version
          for target in x86_64-linux-gnu aarch64-linux-gnu; do
            for language in "c -std=c11" "c++ -std=c++11"; do
              echo "== $target, $language"
              clang --target=$target -ffreestanding -fsyntax-only -Wall -Wextra -Werror -x $language crates/host/include/hapto.h
            done
          done

  # Full run only.
  # The core and the C interface type-check for the 64-bit ARM targets the
  # adapter ships for: Linux hosts and Android.
  cross-check:
    name: cross check (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, aarch64-linux-android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Core and bridge
        run: cargo check --locked --target ${{ matrix.target }} --workspace --exclude hapto-host --exclude hapto-webview --exclude hapto-standalone --exclude hapto-example-eq --exclude hapto-example-gain --exclude hapto-example-midi-probe --exclude hapto-testkit --exclude xtask
      - name: C interface and example EQ
        run: cargo check --locked --target ${{ matrix.target }} -p hapto-host -p hapto-example-eq --no-default-features --features hapto-host/cabi,hapto-example-eq/cabi
      - name: C interface alone
        run: cargo check --locked --target ${{ matrix.target }} -p hapto-host --features cabi

  # Full run only. Licences, advisories, bans and sources, by deny.toml.
  deny:
    name: cargo deny
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  # Full run only. Line coverage of the code Linux builds, failing below the
  # kept threshold.
  coverage:
    name: coverage
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      # The repository's tools are not measured: xtask, and cargo-hapto, which
      # runs Cargo, npm and Node as processes.
      PACKAGES: --workspace --exclude hapto-testkit --exclude xtask --exclude cargo-hapto
      FEATURES: --no-default-features --features hapto-host/cabi,hapto-host/test-host,hapto-example-eq/cabi
      # Tests, benchmarks and the test hosts are not measured. Nor are the
      # VST3 editor view and the slot that drives an editor for it: Linux
      # builds both, but the exporter offers a view on Windows alone, so
      # only Windows runs them, in the view's own tests.
      EXCLUDE: '(/tests/|/benches/|/testkit/|test_host\.rs|/test_host/|tests\.rs|/vst3/view(\.rs|/)|/engine/editor\.rs)'
      # Measured line coverage minus one point (docs/testing.md).
      COVERAGE_LINES: "92"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov@0.8.5
      - name: Measure
        run: cargo llvm-cov $PACKAGES $FEATURES --locked --ignore-filename-regex "$EXCLUDE" --fail-under-lines "$COVERAGE_LINES" --lcov --output-path lcov.info
      - name: Summary
        if: always()
        run: cargo llvm-cov report --ignore-filename-regex "$EXCLUDE" | tail -40
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore

  # Full run only.
  # The example EQ's VST3 bundle, which `cargo hapto validate` builds, lays out
  # as an author's is and runs pluginval on, then the Steinberg validator, built
  # from the VST3 SDK at a pinned commit. One job, so the bundle is built once;
  # the second validator runs whether or not the first passed.
  validators:
    name: plugin validators (windows)
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    runs-on: windows-2025
    env:
      PLUGINVAL_VERSION: v1.0.4
      PLUGINVAL_SHA256: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab
      VST3_SDK_TAG: v3.8.1_build_84
      VST3_SDK_COMMIT: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # cargo hapto passes Cargo no --locked, so the lockfile is checked here.
      - run: cargo fetch --locked
      - name: Download pluginval
        shell: bash
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Windows.zip"
          echo "${PLUGINVAL_SHA256}  pluginval.zip" | sha256sum -c -
          unzip -q pluginval.zip
      # Its strictness and options are the command's: crates/cli/src/validate.rs.
      - name: pluginval
        shell: bash
        run: cargo hapto validate -p hapto-example-eq --pluginval ./pluginval.exe --logs pluginval-logs
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pluginval-logs
          path: pluginval-logs
          if-no-files-found: ignore
      - name: The Steinberg validator, if built before
        id: cached
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vst3sdk-build/bin/Release
          key: vst3-validator-${{ env.VST3_SDK_COMMIT }}
      - name: Build the Steinberg validator
        if: ${{ !cancelled() && steps.cached.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          git clone --depth 1 --branch "$VST3_SDK_TAG" --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          test "$(git -C vst3sdk rev-parse HEAD)" = "$VST3_SDK_COMMIT"
          cmake -S vst3sdk -B vst3sdk-build -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_RUN_VST_VALIDATOR=OFF
          cmake --build vst3sdk-build --config Release --target validator --parallel 4
      - name: The Steinberg validator
        if: ${{ !cancelled() }}
        shell: bash
        run: vst3sdk-build/bin/Release/validator.exe "target/bundle/Hapto Example EQ.vst3"

  # Full run only.
  # `cargo hapto init` writes a crate with this checkout's crates, and its
  # ignored test builds and tests that crate, so a change on main that breaks
  # the template fails here. It builds a whole plugin crate in a target folder
  # of its own, minutes, so the full run alone takes it. Windows, where the
  # crate's default features build its VST3 module; its standalone app is
  # behind a feature the test leaves off, so it is not built here.
  template:
    name: cargo hapto init (windows)
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: A new crate builds and passes its tests
        run: cargo test -p cargo-hapto -- --ignored

  # Instruction counts of the EQ's block, a host write, learn's dispatch and
  # UMP decoding; on a pull request, compared with its base.
  bench:
    name: benchmarks
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: valgrind and the iai-callgrind runner
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          cargo install iai-callgrind-runner --version 0.16.1 --locked
      - name: Benchmarks
        run: scripts/run-benches.sh "${BASE}"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.bench_base || '' }}
