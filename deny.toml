# cargo-deny: what the dependency tree may contain. CI runs
# `cargo deny --locked check` (.github/workflows/ci.yml) over the workspace.
# fuzz/ is a workspace of its own, so this check does not read it. Its tree
# adds libfuzzer-sys, whose licence includes NCSA, which is not allowed below.

[graph]
all-features = true

[licenses]
# Exactly the licences the tree has today. A new one fails the check until
# someone reads it and adds it here; THIRD-PARTY-NOTICES carries the texts the
# licences below require a distribution to keep.
allow = [
    "Apache-2.0",
    "BSD-1-Clause",
    # libloading, which winit's Linux keyboard backend reaches through dlib:
    # hapto-standalone takes winit on Windows only, so no Hapto build has it.
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    # foldhash, which wry's Android backend reaches through dom_query: no
    # Hapto plugin builds it. Its notice clause binds source distributions,
    # not binaries.
    "Zlib",
]
# target-lexicon, which the GTK bindings' build scripts use through
# system-deps on Linux. It runs while the page's helper builds, and nothing
# that ships carries it.
exceptions = [
    { crate = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] },
]
confidence-threshold = 0.93
# Hapto's own crates are not published (they name MIT, but are not checked
# against the list above).
private = { ignore = true }

[advisories]
# Known vulnerabilities, unmaintained crates and yanked releases fail.
unmaintained = "all"
yanked = "deny"
# The first two reach the tree only through iai-callgrind, the benchmark
# harness (a dev-dependency of four crates), and neither ships in a plugin.
# proc-macro-error is a macro crate of the GTK bindings, so it runs while the
# page's helper builds and doesn't ship either.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode, in the benchmark harness only" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2, in the benchmark harness's macros only" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, in the GTK bindings' macros only" },
]

[bans]
# Two versions of one crate (syn 2 and 3 today) are reported, not refused.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
