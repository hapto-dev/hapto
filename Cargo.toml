[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Christopher N Vlavianos"]
license = "MIT"
repository = "https://github.com/hapto-dev/hapto"
readme = "README.md"
publish = false

# ARCHITECTURE.md's three tiers (core, projections, shells), as the eight layers
# scripts/check-core-deps.py keeps, each crate depending only on lower ones:
#   0  hapto-testkit (test tools), hapto-macros (the parameters' derives and
#      `manifest_info!`)
#   1  hapto-params, hapto-ump
#   2  hapto-undo, hapto-session
#   3  hapto-learn (the core's top), hapto-bridge (the page)
#   4  hapto-host (plugin formats)
#   5  hapto-webview (the page in a plugin's window, a shell), hapto-standalone
#      (a plugin as an app of its own, a shell)
#   6  hapto-example-eq and hapto-example-gain, plugins; 7 xtask and
#      cargo-hapto
# The core (layers 1 to 3) builds with no window, WebView or host dependency;
# that script enforces both in CI.
[workspace.dependencies]
hapto-params = { path = "crates/params" }
hapto-undo = { path = "crates/undo" }
hapto-session = { path = "crates/session" }
hapto-learn = { path = "crates/learn" }
hapto-ump = { path = "crates/ump" }
hapto-host = { path = "crates/host" }
hapto-bridge = { path = "crates/bridge" }
hapto-macros = { path = "crates/macros" }
hapto-webview = { path = "crates/webview" }
hapto-standalone = { path = "crates/standalone" }
# Tests only.
hapto-testkit = { path = "crates/testkit" }

# The command's and the app's errors, each with the step that failed.
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip` parses every f64 to the nearest value, so a save, a load
# and a save write the same digits; without it about one in ten drifts a bit.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
# TypeScript declarations generated from the bridge's Rust types.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
# VST3 SDK 3.8.0 bindings (the VST3 exporter is to define the 3.8.1 additions
# itself), generated from the SDK's MIT-licensed headers (THIRD-PARTY-NOTICES).
vst3 = "0.3.0"
# Win32, for the VST3 exporter's main-thread timer on Windows. Already in
# the lockfile through other crates.
windows-sys = "0.61.2"
# The host's window as a toolkit takes it: the editor's parent window in
# hapto-host.
raw-window-handle = "0.6.2"
# The page's WebView in a plugin's window (hapto-webview), on Windows. Pinned
# exactly: the editor's handling of the message loop its start-up runs was
# read from this version's WebView2 source. No default features: those are
# its Linux backend's (GTK and WebKitGTK), which Hapto does not build.
wry = { version = "=0.57.2", default-features = false }
# Learn's dispatch snapshot: the audio thread takes the newest table
# without waiting, and a replaced one drops on the UI thread. MPL-2.0, used
# unmodified (THIRD-PARTY-NOTICES).
# Pinned exactly: the snapshot's soundness rests on this version's source,
# as crates/learn/src/snapshot.rs checks it.
triple_buffer = "=9.0.0"
# The parameters' derives (hapto-macros). The versions xtask already locks, so
# no third syn joins the build.
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }
# The manifest reader behind hapto-host's `manifest_info!` (hapto-macros): the
# parser only, which keeps each value's place in the file, and no serde.
toml = { version = "1.2.1", default-features = false, features = ["std", "parse"] }
# Tests only: property tests. CI raises the case count on a run started by
# hand (PROPTEST_CASES). No forking or timeouts, which need extra crates.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Tests only: instruction-count benchmarks for CI (benches/iai.rs in four
# crates), run under valgrind on Linux. The runner binary CI installs must
# be this version.
iai-callgrind = "=0.16.1"
# Model checks of the lock-free hand-offs, run with RUSTFLAGS="--cfg loom".
loom = "0.7.2"
# Tests only: counts allocations made where the audio thread may not make
# one. Without the default "disable_release", so it also guards release-built
# tests; the warn features count a violation instead of aborting, so a gate
# fails as a test with a message rather than killing the test binary.
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }

[workspace.lints.rust]
# Only the boundary code may use unsafe: hapto-host's format exporters (VST3
# COM and the C ABI) and the modules they share (the boundary, the engine and
# the fault reports), each allowing it on its own module.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
# Every public item says what it is for.
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# A `pub` item nothing outside its crate can reach is `pub(crate)`.
unreachable_pub = "warn"
# `loom` is the model checker's cfg: RUSTFLAGS="--cfg loom" swaps the atomics
# of the hand-offs it models. `hapto_rtsan` marks the audio entry points for
# the nightly real-time sanitizer lane.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(hapto_rtsan)'] }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
# Every unsafe block says why it holds (`// SAFETY:`).
undocumented_unsafe_blocks = "warn"
redundant_closure_for_method_calls = "warn"
# Public docs carry their failure modes in the standard sections.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
doc_markdown = "warn"
# Functions stay under 100 lines (clippy's default threshold).
too_many_lines = "warn"

[profile.release]
lto = "fat"
codegen-units = 1

# A release build with debug info, for profilers.
[profile.profiling]
inherits = "release"
debug = true
