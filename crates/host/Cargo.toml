[package]
name = "hapto-host"
description = "The format-agnostic plugin trait, and its VST3 and C ABI exporters behind features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["audio", "plugin", "vst3", "juce"]
categories = ["multimedia::audio", "api-bindings"]
publish.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# The plugin `manifest_info!`'s doc example declares, since the macro reads
# the manifest of the crate it is used in. No plugin ships from this crate,
# which is no cdylib.
[package.metadata.hapto]
name = "Tone"
vendor = "Example"
url = "https://example.com"
id = "com.example.tone"
vst3-class-id = "8f3c2a71-5d0e-4b96-a1c4-7e25d9b03f68"
au-codes = { subtype = "tone", manufacturer = "Exmp" }
category = "effect"
features = ["equalizer"]

[features]
# VST3, natively in Rust: parameters, automation, state, bus layouts and a
# main-thread timer, for Windows and macOS. No MIDI reaches a plugin through
# it yet.
vst3 = ["dep:vst3", "dep:windows-sys"]
# The C ABI and generated header the JUCE adapter (AU, AUv3, AAX, hosting)
# is driven by.
cabi = []
# The test hosts, `vst3::TestHost` and `cabi::TestHost`, which drive a plugin
# through an exporter in tests: for a plugin crate's dev-dependencies, so a
# shipping plugin carries none of it.
test-host = []
# `manifest_info!`, which writes a plugin's `PluginInfo` from its manifest's
# `[package.metadata.hapto]`, checked while compiling.
manifest = ["dep:hapto-macros", "hapto-macros/manifest"]

[dependencies]
hapto-learn.workspace = true
hapto-macros = { workspace = true, optional = true }
hapto-params.workspace = true
hapto-session.workspace = true
hapto-ump.workspace = true
hapto-undo.workspace = true
serde.workspace = true
serde_json.workspace = true
vst3 = { workspace = true, optional = true }
# The host's window an editor opens in, as every toolkit takes one.
raw-window-handle.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(loom)'.dependencies]
loom.workspace = true

[dev-dependencies]
hapto-testkit.workspace = true

[lints]
workspace = true
