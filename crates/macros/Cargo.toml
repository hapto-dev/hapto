[package]
name = "seam-macros"
description = "The derives behind seam-params' Params and Choices, and seam-host's manifest_info!, which reads a plugin's identity from its manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["audio", "plugin", "parameters", "derive"]
categories = ["multimedia::audio"]
publish.workspace = true

[lib]
proc-macro = true

[features]
# `manifest_info!`, behind seam-host's `manifest` feature, so the derives
# alone build no TOML parser.
manifest = ["dep:toml"]

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
toml = { workspace = true, optional = true }

[lints]
workspace = true
